          type: integer
          readOnly: true
        application:
          type: integer
        application_id:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        requested_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        risk_score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
