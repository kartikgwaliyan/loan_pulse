          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        full_name:
