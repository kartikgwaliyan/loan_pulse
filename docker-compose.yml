version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: loanpulse_oracle
    environment:
      - ORACLE_PASSWORD=loanpulse123
      - APP_USER=loanpulse
      - APP_USER_PASSWORD=loanpulse123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'exit' | sqlplus -L loanpulse/loanpulse123@//localhost:1521/FREEPDB1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: loanpulse_backend
    environment:
      - DB_ENGINE=oracle
      - ORACLE_HOST=oracle-db
      - ORACLE_PORT=1521
      - ORACLE_SERVICE_NAME=FREEPDB1
      - ORACLE_USER=loanpulse
      - ORACLE_PASSWORD=loanpulse123
      - DJANGO_SECRET_KEY=loanpulse-prod-secret-key-oracle-2026
      - DEBUG=False
      - ALLOWED_HOSTS=*
    ports:
      - "8000:8000"
    depends_on:
      oracle-db:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: loanpulse_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  oracle_data:
